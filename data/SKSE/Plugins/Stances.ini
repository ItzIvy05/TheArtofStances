[XP]
; Skill-use magnitude sent to Custom Skills Framework per valid player kill.
; CSF applies the Stances.json formula after this.
fSkillUsePerKill = 8.0

; Adds victim level * fVictimLevelMult to fSkillUsePerKill.
bScaleWithVictimLevel = true
fVictimLevelMult = 0.35

[Keybinds]
; W, A, S, D are ignored while held so stances can switch mid-movement.
sBearStanceKey = shift+x
sWolfStanceKey = x
sHawkStanceKey = ctrl+x
sNeutralStanceKey = 
; Cycles Bear > Wolf > Hawk. Leave empty to disable cycling.
sCycleStanceKey =

[General]
bApplyStanceOnStart = false

[HUD]
bShowWidget = true
iHudX = 64
iHudY = 620
iHudScale = 100
bAutoHideWidget = true
iWidgetSeconds = 10

[Debug]
bEnableLogging = false