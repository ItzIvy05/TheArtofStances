[XP]
; Skill-use magnitude sent to Custom Skills Framework per valid player kill.
; CSF applies the Stances.json formula after this.
fSkillUsePerKill = 8.0

; Adds victim level * fVictimLevelMult to fSkillUsePerKill.
bScaleWithVictimLevel = true
fVictimLevelMult = 0.35

[Keybinds]
; Keyboard scan codes (C = 46), mouse buttons from 256, controller buttons from 266. -1 = unbound.
iBearStanceKey = -1
iWolfStanceKey = -1
iHawkStanceKey = -1
iNeutralStanceKey = -1
; Cycles Bear > Wolf > Hawk.
iCycleStanceKey = 46

[HUD]
bShowWidget = true
iHudX = 1237
iHudY = 661
iHudScale = 25
bAutoHideWidget = false
iWidgetSeconds = 10

[Debug]
bEnableLogging = false